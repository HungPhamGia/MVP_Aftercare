<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- Tiêu đề -->
  <text x="800" y="54" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e293b">Lộ trình hạ tầng — MVP demo → Triển khai thực tế 100% tại Việt Nam</text>

  <!-- ============ KHỐI MVP ============ -->
  <rect x="60" y="110" width="580" height="500" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="350" y="152" text-anchor="middle" font-size="21" font-weight="bold" fill="#92400e">GIAI ĐOẠN MVP / DEMO (hiện tại)</text>

  <rect x="90" y="178" width="520" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="112" y="205" font-size="17" font-weight="bold" fill="#1e293b">🌍 Render — hosting demo</text>
  <text x="112" y="229" font-size="14" fill="#64748b">HTTPS mặc định · deploy vài phút — server nước ngoài</text>

  <rect x="90" y="254" width="520" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="112" y="281" font-size="17" font-weight="bold" fill="#1e293b">🌍 Supabase — Postgres demo</text>
  <text x="112" y="305" font-size="14" fill="#64748b">kết nối bắt buộc TLS — server nước ngoài</text>

  <rect x="90" y="330" width="520" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="112" y="357" font-size="17" font-weight="bold" fill="#1e293b">🌍 OpenAI GPT — AI hội thoại + phân tích</text>
  <text x="112" y="381" font-size="14" fill="#64748b">chỉ nhận dữ liệu đã tối thiểu hóa (không BHYT/ICD/SĐT)</text>

  <rect x="90" y="406" width="520" height="64" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="112" y="433" font-size="17" font-weight="bold" fill="#1e293b">🇻🇳 VNPT SmartVoice — STT / TTS</text>
  <text x="112" y="457" font-size="14" fill="#0f766e">đã là dịch vụ trong nước ngay từ MVP ✓</text>

  <rect x="90" y="496" width="520" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="530" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">🛡️ An toàn vì: dữ liệu 100% hư cấu</text>
  <text x="350" y="560" text-anchor="middle" font-size="15" fill="#92400e">không một PHI thật nào rời Việt Nam</text>

  <!-- ============ MŨI TÊN CHUYỂN ĐỔI ============ -->
  <polygon points="665,330 880,330 880,305 935,360 880,415 880,390 665,390" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="795" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#115e59">chuyển đổi không sửa code</text>
  <text x="795" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#115e59">hồi hương dữ liệu</text>
  <text x="795" y="444" text-anchor="middle" font-size="15" fill="#1e293b">• đổi 1 chuỗi DATABASE_URL</text>
  <text x="795" y="470" text-anchor="middle" font-size="15" fill="#1e293b">• đóng container FastAPI</text>

  <!-- ============ KHỐI VIỆT NAM ============ -->
  <rect x="960" y="80" width="580" height="580" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1250" y="122" text-anchor="middle" font-size="21" font-weight="bold" fill="#115e59">TRIỂN KHAI THẬT — 100% TẠI VIỆT NAM</text>

  <rect x="990" y="148" width="520" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1012" y="175" font-size="17" font-weight="bold" fill="#1e293b">🏥 Hạ tầng trong nước</text>
  <text x="1012" y="199" font-size="14" fill="#64748b">on-premise tại bệnh viện, hoặc cloud nội địa</text>
  <text x="1012" y="221" font-size="14" fill="#64748b">VNPT · Viettel · FPT Cloud — dữ liệu không rời VN</text>

  <rect x="990" y="246" width="520" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1012" y="273" font-size="17" font-weight="bold" fill="#1e293b">🗄️ PostgreSQL tự quản trong nước</text>
  <text x="1012" y="297" font-size="14" fill="#64748b">mã hóa at rest · backup định kỳ lưu trong nước</text>

  <rect x="990" y="322" width="520" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1012" y="349" font-size="17" font-weight="bold" fill="#1e293b">🧠 AI — 3 mức theo độ nhạy cảm</text>
  <text x="1012" y="373" font-size="14" fill="#64748b">① PHI-minimized + DPA   ② LLM nội địa</text>
  <text x="1012" y="395" font-size="14" fill="#64748b">③ self-host trong bệnh viện — không dữ liệu ra ngoài</text>

  <rect x="990" y="420" width="520" height="86" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1012" y="447" font-size="17" font-weight="bold" fill="#1e293b">🔐 Bổ sung bắt buộc trước dữ liệu thật</text>
  <text x="1012" y="471" font-size="14" fill="#64748b">SSO/RBAC · audit log · secret manager</text>
  <text x="1012" y="493" font-size="14" fill="#64748b">log không chứa PHI · tách môi trường dev/prod</text>

  <rect x="990" y="528" width="520" height="84" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1250" y="562" text-anchor="middle" font-size="16" font-weight="bold" fill="#115e59">⚖️ Tuân thủ: NĐ 13/2023 · Luật BVDLCN (01/01/2026)</text>
  <text x="1250" y="590" text-anchor="middle" font-size="15" fill="#115e59">NĐ 53/2022 · TT 46/2018 và TT 54/2017 — Bộ Y tế</text>

  <!-- ============ TIMELINE 3 GIAI ĐOẠN ============ -->
  <rect x="60" y="720" width="440" height="90" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="280" y="756" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">1 · MVP / cuộc thi</text>
  <text x="280" y="786" text-anchor="middle" font-size="14" fill="#92400e">Supabase + Render — dữ liệu hư cấu</text>

  <text x="527" y="775" text-anchor="middle" font-size="28" font-weight="bold" fill="#64748b">➜</text>

  <rect x="555" y="720" width="460" height="90" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="785" y="756" text-anchor="middle" font-size="17" font-weight="bold" fill="#115e59">2 · Pilot 1 bệnh viện</text>
  <text x="785" y="786" text-anchor="middle" font-size="14" fill="#115e59">hạ tầng VN · dữ liệu thật phạm vi hẹp · SSO/RBAC + audit</text>

  <text x="1042" y="775" text-anchor="middle" font-size="28" font-weight="bold" fill="#64748b">➜</text>

  <rect x="1070" y="720" width="470" height="90" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1305" y="756" text-anchor="middle" font-size="17" font-weight="bold" fill="#115e59">3 · Triển khai rộng</text>
  <text x="1305" y="786" text-anchor="middle" font-size="14" fill="#115e59">chuẩn on-prem/cloud VN · LLM nội địa · pentest định kỳ</text>
</svg>
